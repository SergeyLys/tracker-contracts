syntax = "proto3";

package authService;

import "common/auth.proto";

service AuthService {
  rpc Register(common.RegisterRequest) returns (common.AuthResponse);
  rpc Login(common.LoginRequest) returns (common.AuthResponse);
  rpc LoginWithGoogle(common.LoginRequest) returns (common.AuthResponse);
  rpc refresh(common.RefreshTokenRequest) returns (common.AuthResponse);
}
